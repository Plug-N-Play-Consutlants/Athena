[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athenaengine"
version = "0.7.10.49.0"
description = "AthenaEngine deterministic sports intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["Athena*", "Core*", "Diagnostics*", "Engine*", "Intelligence*", "Knowledge*", "Providers*", "Reasoning*", "Scout*", "Sports*", "Experience*"]
namespaces = true

[tool.athena]
build = "0.7.10.49.0"
release_name = "Period Evidence Diagnostics & Decision Gates"
version_schema = "major.epic.sprint.patch.hotfix"
studio_first = true
