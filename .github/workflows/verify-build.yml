name: AthenaEngine Verify Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke:
    name: Repository smoke validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile repository Python files
        run: python -m compileall -q Athena Core Diagnostics Engine Intelligence Knowledge Providers Reasoning Scout Sports Tools Tests

      - name: Validate inquiry execution diagnostic contract
        run: |
          PYTHONPATH=. python Tests/validate_inquiry_trace_contract.py
          PYTHONPATH=. python Tests/validate_inquiry_completion_071027.py
          PYTHONPATH=. python Tests/validate_architecture_boundaries_0710210.py
          PYTHONPATH=. python Tests/validate_recap_execution_and_completion_0710211.py
          PYTHONPATH=. python Tests/validate_unified_completion_071030.py
          PYTHONPATH=. python Tests/validate_evidence_reconciliation_071040.py
          PYTHONPATH=. python Tests/validate_team_synthesis_071050.py
          PYTHONPATH=. python Tests/validate_studio_doctor_summary_071060.py

      - name: Validate release hygiene
        run: python Tests/validate_release_hygiene.py

      - name: Doctor release hygiene
        run: python Tools/doctor_release_hygiene.py
