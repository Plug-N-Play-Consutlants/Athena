[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athenaengine"
dynamic = ["version"]
description = "AthenaEngine deterministic sports intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["Athena*", "Core*", "Diagnostics*", "Engine*", "Intelligence*", "Knowledge*", "Providers*", "Reasoning*", "Scout*", "Sports*", "Experience*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "Core.version.ATHENA_VERSION"}

[tool.athena]
build = {attr = "Core.version.ATHENA_BUILD"}
release_name = {attr = "Core.version.RELEASE_NAME"}
version_schema = "major.epic.sprint.patch.hotfix"
studio_first = true
